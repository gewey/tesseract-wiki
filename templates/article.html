<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/wiki.js"></script>

      <div class="article-meta" style="font-size: 0.85em; color: #a855f7; margin-bottom: 24px;">

      </div>

        {{CONTENT}}
      </section>
